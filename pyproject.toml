[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opik-rigor"
version = "0.1.1"
description = "Statistical assertions and pinned-judge evaluation primitives for LLM test suites."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "E. Wehmeyer" }]
keywords = ["llm", "evaluation", "testing", "opik", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  # No "License :: OSI Approved ::" classifier: PEP 639 deprecates it in favour
  # of the SPDX `license` field above, and PyPI rejects uploads that set both.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
# numpy is declared even though scipy pulls it transitively: distribution.py imports
# it directly, and assert_score_distribution's public docstring pins mean, p10 and
# stddev to numpy's exact semantics (numpy.mean, numpy.percentile linear
# interpolation, numpy.std(ddof=1)). An undeclared direct import is a dependency
# that exists only by accident, and the accident ends the moment scipy moves behind
# an extra. >=1.21 is where the numpy.typing surface and the current scalar type
# names settled; scipy>=1.10 already requires >=1.19.5.
#
# scipy stays a hard dependency, not an extra: assert_no_regression imports it
# lazily but still needs it, and `pip install opik-rigor` must keep working for
# that gate. Moving it behind an extra is a breaking change and waits for 0.2.
dependencies = ["numpy>=1.21", "scipy>=1.10"]

[project.optional-dependencies]
# Bounds justified in COMPATIBILITY.md: the surface was verified against 2.2.28,
# and a major bump is exactly where trace()'s keyword names would move -- which
# fails silently, because trace() ends in **ignored_kwargs.
opik = ["opik>=2.0,<3"]
pytest = ["pytest>=7.0"]
# `build` and `hatchling` are dev-only so that tests/test_packaging.py can build a
# wheel and read the zip rather than reading src/. hatchling is the backend already
# declared in [build-system] above; having it importable lets that build run with
# --no-isolation, which is offline and deterministic. Without both the wheel checks
# skip -- and a packaging check that skips is how 0.1.0 shipped without py.typed.
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6", "build>=1.0", "hatchling>=1.20"]
# The package ships `py.typed`, which is a promise to a downstream user's type
# checker that these annotations are complete enough to check against. Nothing
# verified that promise until `verify_release.py`'s `wheel-annotations` check, and
# that check needs a checker installed -- so mypy is declared here rather than left
# to whoever remembers. It is a separate extra from `dev` because it is the only
# dependency in this file that CI's build job needs and CI's test job does not.
#
# pyright is deliberately absent. It is distributed as a Node program (the PyPI
# package downloads a node runtime on first run), which is a network fetch and a
# second language runtime inside a release gate whose whole point is to be
# hermetic. It is a documented release-time check instead -- see docs/TYPING.md --
# and the two checkers disagree only about the package's *internals*, never about
# what a consumer sees.
#
# `pytest` is here because the wheel ships `integrations/pytest_plugin.py`, which
# imports it. Without it in the environment, `mypy --strict` over the extracted
# wheel cannot resolve the import and cascades: one `import-not-found` becomes
# three `untyped-decorator` errors on `pytest_pyfunc_call`, `rigor_judge` and
# `rigor_evidence`, and the whole check fails on a wheel whose annotations are
# fine. It passed locally and failed on its first CI run, because the repo venv
# has pytest and the build job did not -- the same shape as the `twine check`
# colour bug: an expectation that quietly encodes the environment it was written
# in. Note this is a *type-checking* prerequisite, not a runtime one; `pytest`
# remains an optional extra for the plugin's users.
typecheck = ["mypy>=1.11", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/ericwehmeyer/opik-rigor"
Repository = "https://github.com/ericwehmeyer/opik-rigor"
Issues = "https://github.com/ericwehmeyer/opik-rigor/issues"

# Registered as "rigor", never "opik": Opik ships its own pytest11 plugin under
# that name (opik.plugins.pytest.hooks). See COMPATIBILITY.md. Verified by
# installing both into one foreign project: the two entry points coexist under
# distinct names, collection succeeds, and rigor's reported numbers are identical
# with opik present.
#
# This comment used to end "The module imports nothing third-party at module
# scope, so loading it is cheap for suites that never use the marker." The first
# half is true of the module and irrelevant; the second half is false. Importing
# the plugin runs opik_rigor/__init__.py, which re-exports .distribution, which
# imports numpy -- a measured +88.7ms on `pytest --collect-only` in a foreign
# 16-test project, paid by every pytest process on the machine whether or not any
# test uses the marker (minimum of 15 interleaved runs against `-p no:rigor`).
# See the note in integrations/pytest_plugin.py for why deferring this module's
# own imports does not fix it, and what would.
[project.entry-points.pytest11]
rigor = "opik_rigor.integrations.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/opik_rigor"]

# An allowlist, not a denylist, and that choice is the point.
#
# With no sdist target declared at all, hatchling falls back to "everything the
# repository holds that .gitignore does not exclude". The agent worktrees and the
# session-memory directory are excluded in `.git/info/exclude`, which hatchling
# does not read -- so `python -m build` on this machine produced a 122-member
# sdist, 71 members of which were a second full copy of the tree under
# `.claude/worktrees/` plus 25 `.remember/` files. The published 0.1.1 sdist is
# clean at 47 members only because CI builds from a fresh checkout where those
# directories do not exist. That is protection by accident of environment, and it
# fails the moment anyone builds a release locally.
#
# A denylist would fix today's two directories and miss whatever tool creates the
# next one. An allowlist fails the other way -- by omitting something needed --
# and that direction is already caught: `verify_release.py`'s `sdist-contents`
# check looks for missing content, and nothing looked for surplus content until
# `tests/test_packaging.py` gained a test for it alongside this.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/scripts",
  "/.github",
  "/README.md",
  "/CHANGELOG.md",
  "/COMPATIBILITY.md",
  "/PROGRESS.md",
  "/LICENSE",
  "/pyproject.toml",
  "/.gitignore",
  "/.gitattributes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "requires_network: test needs a live provider endpoint (deselected by default in CI)",
  "requires_opik: test needs a reachable Opik instance",
]

# Strict, because `py.typed` claims exactly that. The marker tells a downstream
# user's checker to trust these annotations; anything less than --strict here would
# be promising a standard the package does not hold itself to.
#
# Scope is `src` only. The test suite is not type-checked: it exists partly to feed
# deliberately wrong types into the validators (`assert_pass_rate("nonsense", ...)`)
# and a checker would be correct to reject every one of those calls.
[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

# The four modules below are imported *inside functions*, never at module scope, and
# each is either optional or untyped. None of them appears in a public signature --
# `_mannwhitneyu()` is annotated `-> Any` precisely so that SciPy's absent types
# cannot leak into `assert_no_regression`'s -- so silencing them here does not widen
# anything a consumer can see.
#
# anthropic / openai / opik are optional extras: a minimal `pip install opik-rigor`
# does not have them, and the adapters raise a helpful AdapterError when the import
# fails. Type-checking the package must not require installing every provider SDK.
#
# scipy is a *hard* dependency and is still listed here, which is worth stating
# plainly: as of scipy 1.18 the package ships no `py.typed` marker anywhere, so it
# has no inline types at all. Third-party `scipy-stubs` exists but is not depended on
# -- it would be a build-time dependency added to satisfy a checker rather than the
# code. If scipy ever ships its own marker, delete this override and see what breaks.
[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "opik.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["opik_rigor"]
branch = true
