# Publishing is triggered by publishing a GitHub Release -- not by pushing a tag.
# A tag alone does nothing; the release has to be published (draft -> published).
#
# Trusted publishing (OIDC) only: there is no token and no secret in this file.
# Before the first run, a *pending publisher* must be created on PyPI and on
# TestPyPI, matching owner/repo/workflow-filename/environment exactly. Until that
# exists the upload fails at the auth step -- that is the expected first failure.
#
# The release step is effectively irreversible. A version can be yanked, but the
# number can never be reused: 0.1.0 uploaded wrong means the fix ships as 0.1.1.
# Dry-run through the testpypi job (manual dispatch) before cutting a release.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # Never cancel a run mid-upload -- a half-finished publish is not something we
  # want to race with a second one.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # `twine check` passed the 0.1.0 wheel, which shipped no py.typed, no
      # packaged rubric, and no package data in the sdist. It validates metadata
      # and long-description rendering; it never opens the zip. This does.
      #
      # The editable install is load-bearing, not hygiene: `distribution.py`
      # imports scipy at module scope, so the isolated `-E -S` probe cannot
      # import the extracted wheel without the dependencies present -- and a
      # probe that cannot import reports FAIL, not skip. Editable specifically,
      # because it puts nothing named `opik_rigor` into site-packages, so the
      # probe's "no other sys.path entry holds an opik_rigor" evidence stays
      # true. Installed after the build so no editable artefact reaches the
      # sdist.
      - run: python -m pip install -e .
      # No --allow-dev-version here, deliberately. On this workflow the
      # version-not-dev check is the one that earns its keep: it is the last
      # gate before an artifact is uploaded to an index that will never let the
      # filename be reused.
      - run: python scripts/verify_release.py --no-build
      # Upload last, so a downloadable `dist` only ever exists for a build that
      # passed verification.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # Manual dispatch only. The two publish jobs are split by event rather than by
    # discipline so that a dispatch can never reach the real index: this job's
    # condition is false on `release`, and the pypi job's is false on
    # `workflow_dispatch`, so exactly one of them is ever eligible per run.
    if: github.event_name == 'workflow_dispatch'
    environment: testpypi
    permissions:
      # id-token is the entire authentication mechanism here -- no secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Pinned to a commit SHA, not the v1.14.2 tag. A git tag is mutable and can
      # be repointed by whoever controls the repository; this job holds
      # id-token: write, so what runs here can mint a token that publishes under
      # our name. The version is in the trailing comment for readability -- update
      # both together.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Published releases only -- see the note on the testpypi job.
    if: github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # The version comes from pyproject.toml, not from the tag, so the two can
      # drift silently -- a release tagged v0.2.0 would cheerfully upload 0.1.0
      # under that name, and that number could then never be reused. Cheap check,
      # irreversible mistake.
      - name: Refuse to publish if the release tag and the built version disagree
        run: |
          tag="${{ github.event.release.tag_name }}"
          wheel=$(ls dist/*.whl | head -n1)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "release tag:   $tag"
          echo "built version: $version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag '$tag' does not match built version '$version'."
            echo "::error::Fix the version in pyproject.toml, or retag, then re-run."
            exit 1
          fi

      # Pinned to a commit SHA, not the v1.14.2 tag. A git tag is mutable and can
      # be repointed by whoever controls the repository; this job holds
      # id-token: write, so what runs here can mint a token that publishes under
      # our name. The version is in the trailing comment for readability -- update
      # both together.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
